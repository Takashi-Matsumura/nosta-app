services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nosta
      POSTGRES_PASSWORD: nosta
      POSTGRES_DB: nosta
    ports:
      - "5434:5432"
    volumes:
      - nosta-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nosta -d nosta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nosta-db-data:
